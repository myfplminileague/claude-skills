name: Validate canonical skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m py_compile five-a-side/scripts/*.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
